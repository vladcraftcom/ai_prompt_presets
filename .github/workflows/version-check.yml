name: Version Check

on:
  push:
    branches:
      - main
      - master
    paths:
      # Проверяем версию только при изменении файлов пресетов или конфигурации
      - '**/files_config.json'
      - '**/*.md'
      - '.github/workflows/*.yml'
  pull_request:
    branches:
      - main
      - master

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for version in commit message
        id: version_check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # Ищем версию в сообщении коммита (форматы: v0.1, v0.1.0, version 0.1)
          if echo "$COMMIT_MSG" | grep -qE 'v[0-9]+\.[0-9]+(\.[0-9]+)?|version\s+[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            echo "✓ Обнаружена версия в сообщении коммита"
            echo "version_found=true" >> $GITHUB_OUTPUT
          else
            echo "⚠ Версия не обнаружена в сообщении коммита"
            echo "version_found=false" >> $GITHUB_OUTPUT
          fi
      
      - name: List recent tags
        run: |
          echo "Последние 5 тегов:"
          git tag --sort=-version:refname | head -5 || echo "Теги не найдены"
      
      - name: Suggest creating a tag
        if: steps.version_check.outputs.version_found == 'true'
        run: |
          echo "::notice::Обнаружена версия в коммите. Для создания релиза создайте тег:"
          echo "  git tag v0.1.0"
          echo "  git push origin v0.1.0"

